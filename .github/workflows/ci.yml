name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

  lint-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No vendor-specific references in product code
        run: |
          if grep -rniE "bilibili|bili2text" video2subtitle/ tests/ --include="*.py"; then
            echo "::error::vendor-specific references found in product code"
            exit 1
          fi
          echo "clean"
