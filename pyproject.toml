[project]
name = "video2subtitle"
version = "0.1.0"
description = "Self-hosted video → subtitles: CLI + Web UI + REST API with multi-engine ASR (Qwen3-ASR / SenseVoice)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "trtyr" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "sherpa-onnx>=1.12.36",
    "numpy>=1.24",
    "yt-dlp>=2024.8.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
video2subtitle = "video2subtitle.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video2subtitle*"]

[tool.setuptools.package-data]
video2subtitle = ["web_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
